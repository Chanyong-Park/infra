services:
  kudu-master:
    image: apache/kudu:1.17.0
    container_name: kudu-master
    # 실행 명령어를 명시적으로 'master'로 지정합니다.
    command: ["master"]
    environment:
      - KUDU_MASTERS=kudu-master:7051
      - FS_WAL_DIR=/var/lib/kudu/master
      - FS_DATA_DIRS=/var/lib/kudu/master
      # 로그에서 확인된 전용 변수를 사용합니다.
      - >
        MASTER_ARGS=
        --unlock_unsafe_flags
        --use_hybrid_clock=false
    ports:
      - "8051:8051"
      - "7051:7051"

  kudu-tserver:
    image: apache/kudu:1.17.0
    container_name: kudu-tserver
    # 실행 명령어를 명시적으로 'tserver'로 지정합니다.
    command: ["tserver"]
    environment:
      - KUDU_MASTERS=kudu-master:7051
      - FS_WAL_DIR=/var/lib/kudu/tserver
      - FS_DATA_DIRS=/var/lib/kudu/tserver
      # TServer 전용 변수를 사용합니다.
      - >
        TSERVER_ARGS=
        --unlock_unsafe_flags
        --use_hybrid_clock=false
        --tserver_master_addrs=kudu-master:7051
    depends_on:
      - kudu-master

  impala:
    image: apache/impala:4.4.1-impala_quickstart_hms
    container_name: impala-test
    command: ["hms"]
    ports:
      - "21000:21000"
      - "21050:21050"
      - "25000:25000"
    deploy:
      resources:
        limits:
          memory: 12G
