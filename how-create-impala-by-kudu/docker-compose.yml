version: '3'
services:
  # Kudu Master: 메타데이터 관리
  kudu-master:
    image: apache/kudu:latest
    container_name: kudu-master
    ports:
      - "8051:8051"
    command: ["master"]

  # Kudu TServer: 실제 데이터 저장소
  kudu-tserver:
    image: apache/kudu:latest
    container_name: kudu-tserver
    depends_on:
      - kudu-master
    ports:
      - "8050:8050"
    command: ["tserver", "--kudu_master_addrs=kudu-master:7051"]

  # Impala: 쿼리 엔진 (Kudu와 연동)
  impala:
    image: apache/kudu:latest # Kudu 이미지에 Impala가 내장된 통합 버전 사용
    container_name: kudu-impala
    depends_on:
      - kudu-tserver
    ports:
      - "21000:21000" # Impala Shell
      - "21050:21050" # JDBC (Spring Boot 연결용)
      - "25000:25000" # Web UI
    command: ["impala", "--kudu_master_addrs=kudu-master:7051"]
    # 중요: 임팔라는 메모리를 많이 사용하므로 리소스 제한을 넉넉히 주거나 
    # Docker Desktop 설정에서 충분한 메모리(4GB 이상)를 할당해야 합니다.
